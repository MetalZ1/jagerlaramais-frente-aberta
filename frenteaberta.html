    const { left, top } = posPx(...h.pos);
    const art = RETRATO(h.id);
    let cls = "peca t" + h.t;
    if (h === selecionado) cls += " selecionada";
    if ((h.moveu && h.atacou) || h.atordoado) cls += " agiu";
    if (T.times[h.t].mana >= GATILHO_HAB) cls += " habilitavel";
    const efeito = EFEITOS.find(e => e.uid === h._uid);
    if (efeito) cls += " efeito-" + efeito.tipo;
    html += `<div class="${cls}" style="left:${left + 4}px;top:${top + 8}px;${art ? `background-image:url('${art}')` : ""}"
      data-c="${h.pos[0]}" data-r="${h.pos[1]}" data-hid="${h.id}" data-piece="1" title="${HEROIS[h.id].n}">
      ${art ? "" : HEROIS[h.id].n[0]}
      <div class="status">
        ${h.intocavel ? '<span title="Inalvejável">👻</span>' : ""}
        ${h.exausto ? '<span title="Exausto">💤</span>' : ""}
        ${h.atordoado ? '<span title="Atordoado">😵</span>' : ""}
      </div>
      <div class="vidabar"><i style="width:${Math.max(0, 100 * h.vida / h.vidaMax)}%"></i></div>
      <div class="vidaNum">${Math.max(0, h.vida)}/${h.vidaMax}</div>
    </div>`;
  }));
  // símbolo de sucata no centroide de cada Base, e a vida da Base do
  // lado de fora do aglomerado (time 0 sempre nasce à esquerda do
  // CENTRO, time 1 à direita — ver rotacionar180 em construirMapa)
  [0, 1].forEach(tt => {
    const pts = BASES[tt].map(([bc, br]) => posPx(bc, br));
    const cx = pts.reduce((s, p) => s + p.left, 0) / pts.length + 26;
    const cy = pts.reduce((s, p) => s + p.top, 0) / pts.length + 22;
    html += `<div class="baseSimbolo t${tt}" style="left:${cx}px;top:${cy}px">♻</div>`;
    // HP alinhado com o hexágono mais EXTERNO do cluster — BASES[tt][0] é a
    // âncora mais distante do CENTRO (ver clusterBase), não a média dos 3
    const externo = posPx(...BASES[tt][0]);
    const hpY = externo.top + 22;
    const minLeft = Math.min(...pts.map(p => p.left)), maxLeft = Math.max(...pts.map(p => p.left));
    const hpX = tt === 0 ? minLeft - 30 : maxLeft + 52 + 30;
    const baseAtingida = EFEITOS.some(e => e.tipo === "baseHit" && e.t === tt) ? " efeito-dano" : "";
    html += `<div class="baseHp t${tt}${baseAtingida}" style="left:${hpX}px;top:${hpY}px">${T.times[tt].base}</div>`;
  });
  // "explosão" de sucata onde um herói caiu — não é peça (já saiu de T.times[].campo),
  // por isso desenhada à parte, na posição registrada em marcaEfeitoMorte
  EFEITOS.filter(e => e.tipo === "morte").forEach(e => {
    const { left, top } = posPx(...e.pos);
    html += `<div class="efeitoMorte t${e.t}" style="left:${left + 26}px;top:${top + 30}px">💥</div>`;
  });
  // botão de confirmar ataque/cura — some com qualquer outro clique no tabuleiro
  if (confirmacaoPendente) {
    const { left, top } = posPx(...confirmacaoPendente.pos);
    const cura = confirmacaoPendente.tipo === "cura";
    html += `<button class="confirmAcao${cura ? " cura" : ""}" id="btConfirmAcao" style="left:${left + 26}px;top:${top + 2}px"
      title="${cura ? "Confirmar cura" : "Confirmar ataque"}">${cura ? "✚" : "⚔"}</button>`;
  }
  G("board").innerHTML = html;
  G("board").style.width = (COLS * 52 + 26) + "px";
  G("board").style.height = (LINS * 45 + 20) + "px";
  // Limpa com um delay pequeno (não na hora) porque algumas ações chamam
  // render() duas vezes em sequência pro mesmo evento (ex.: confirmarAcao) —
  // limpando na hora, a segunda chamada acharia a fila vazia e apagaria a
  // animação da primeira. 50ms sobrevive a esse "eco" mas não vaza pra a
  // próxima ação de verdade (essas são espaçadas por centenas de ms).
  const efeitosDesteQuadro = EFEITOS;
  setTimeout(() => { if (EFEITOS === efeitosDesteQuadro) EFEITOS = []; }, 50);
  [...G("board").querySelectorAll(".hex")].forEach(el => {
    el.onclick = () => cliqueHex(+el.dataset.c, +el.dataset.r);
  });
  [...G("board").querySelectorAll(".peca")].forEach(el => {
    const c = +el.dataset.c, r = +el.dataset.r, hid = el.dataset.hid;
    const inst = ocupante(c, r);
    seguraEClica(el, () => mostraCarta(hid, inst), () => cliqueHex(c, r));
  });
  const btConfirmAcao = G("btConfirmAcao");
  if (btConfirmAcao) btConfirmAcao.onclick = e => { e.stopPropagation(); confirmarAcao(); };

  // banco
  let bhtml = "";
  tm.bench.forEach(id => {
    const custo = ARQUETIPOS[HERO_ARQ[id]].custo;
    const cara = custo > tm.mana;
    bhtml += `<div class="bcard${bancoSel === id ? " selecionada" : ""}${cara ? " cara" : ""}" data-id="${id}">
      <div class="ret" style="background-image:url('${RETRATO(id)}')"></div>
      <div class="nome">${HEROIS[id].n}</div>
      <div class="custo">${custo}◆</div>
    </div>`;
  });
  G("banco").innerHTML = bhtml;
  [...G("banco").querySelectorAll(".bcard")].forEach(el => {
    const id = el.dataset.id;
    seguraEClica(el, () => mostraCarta(id, null), () => { if (!el.classList.contains("cara")) cliqueBanco(id); });
  });

  // painel de info
  const vezDaCpu = naoEhMinhaVez();
  G("btFim").disabled = vezDaCpu;
  const btHab = G("btHab");
  if (btHab) {
    const hab = selecionado ? habilidadeDe(selecionado) : null;
    const pronta = selecionado && habDisponivel(selecionado);
    btHab.style.display = hab ? "" : "none";
    btHab.disabled = vezDaCpu || !pronta;
    btHab.classList.toggle("pronta", !!pronta);
    btHab.textContent = modoHabilidade ? "Escolha o alvo…" : (hab ? `${hab.nome} · ${hab.custo}◆` : "Habilidade");
  }
  if (vezDaCpu) {
    G("infoHeroi").innerHTML = T.online
      ? `<b>Aguardando ${NOMES[t]}...</b>`
      : `<b>${NOMES[t]} (CPU)</b> está jogando...`;
  } else if (selecionado) {
    const h = selecionado, arq = ARQUETIPOS[h.arq], hab = habilidadeDe(h);
    let infoHtml = `<b>${HEROIS[h.id].n}</b> — ${Math.max(0, h.vida)}/${h.vidaMax} vida ·
      ${arq.cura ? "cura total +1" : "ataque " + arq.dano} · alcance ${arq.alcance}
      <br>👣 anda até ${arq.movTotal} · mover/${arq.cura ? "curar" : "atacar"} custam 1◆ cada`;
    if (hab) {
      infoHtml += `<br><b style="color:var(--mana)">${hab.nome}</b> (${hab.custo}◆, requer ${GATILHO_HAB}◆ estocado) — ${hab.desc}`;
      if (h.exausto) infoHtml += ` <i>— exausto neste turno</i>`;
      if (h.atordoado) infoHtml += ` <i>— atordoado neste turno</i>`;
    }
    if (confirmacaoPendente) {
      infoHtml += `<br><b style="color:var(--brass)">Toque no ${confirmacaoPendente.tipo === "cura" ? "✚" : "⚔"} sobre a casa pra confirmar</b> — qualquer outro clique cancela.`;
    }
    G("infoHeroi").innerHTML = infoHtml;
  } else if (bancoSel) {
    G("infoHeroi").innerHTML = `<b>${HEROIS[bancoSel].n}</b> selecionado — toque num dos pontos de invocação (✦) livres junto à sua Base.`;
  } else {
    G("infoHeroi").textContent = "Toque num herói do banco pra invocar, ou num herói em campo pra agir. Segure o dedo num herói pra ver a carta dele.";
  }
}

/* ───────────────────────── IA da CPU ───────────────────────── */
function espera(ms) { return simulando ? Promise.resolve() : new Promise(res => setTimeout(res, ms)); }
function alvoMaisFraco(lista) {
  return lista.reduce((pior, o) => (o.vida < pior.vida ? o : pior), lista[0]);
}
async function cpuTentaAgir(h) {
  if (h.cura) {
    const ac = alvosCura(h);
    const feridos = ac.aliados.filter(o => o.vida < o.vidaMax);
    if (feridos.length) { curar(h, alvoMaisFraco(feridos)); return true; }
    return false;
  }
  const av = alvosAtaque(h);
  if (av.herois.length) { ataca(h, alvoMaisFraco(av.herois)); return true; }
  if (av.base !== null) { atacaBase(h, av.base); return true; }
  return false;
}
/* ───────────────────────── IA da CPU — Difícil ─────────────────────────
   Mesmas regras do jogo, mas com 3 diferenças: (1) usa distância REAL de
   caminho (contornando rochas e outras peças) em vez da distância em
   linha reta pra escolher rota — é aí que a Normal se perde e manda
   herói pra "cima" à toa; (2) pontua cada alvo possível (abate garantido
   > herói fraco/perigoso > Base) em vez de ir sempre no mais próximo;
   (3) evita expor heróis frágeis (1 de vida) ao alcance de ataque
   inimigo quando dá pra evitar sem abrir mão da jogada. */
function bloqueadaParaIA(c, r, ignorar) {
  if (!valida(c, r) || ehCasaBase(c, r) || OBST_SET.has(kk(c, r))) return true;
  const oc = ocupante(c, r);
  return !!(oc && oc !== ignorar);
}
function distCaminho(origem, destino, ignorar) {
  if (origem[0] === destino[0] && origem[1] === destino[1]) return 0;
  const visitado = new Set([kk(...origem)]);
  let fronteira = [origem];
  for (let d = 1; d <= (COLS + LINS); d++) {
    const prox = [];
    for (const pos of fronteira) {
      for (const viz of vizinhos(...pos)) {
        const chave = kk(...viz);
        if (visitado.has(chave)) continue;
        if (viz[0] === destino[0] && viz[1] === destino[1]) return d;
        if (bloqueadaParaIA(viz[0], viz[1], ignorar)) continue;
        visitado.add(chave);
        prox.push(viz);
      }
    }
    if (!prox.length) break;
    fronteira = prox;
  }
  return Infinity;   // cercado — cai de volta pra distância em linha reta
}
function distReal(origem, destino, ignorar) {
  const d = distCaminho(origem, destino, ignorar);
  return d === Infinity ? dist(origem, destino) : d;
}
function pesoAlvo(h) {
  return { heavy: 4, sniper: 3, medic: 3, soldier: 2, runner: 1 }[h.arq] || 1;
}
/* Prioridade de um alvo de ATAQUE pro atacante `h` — abate garantido vem
   sempre na frente de qualquer outra consideração (pesa 1000: nenhuma
   combinação de peso de arquétipo/vida restante chega perto disso),
   senão pesa o arquétipo do alvo e prefere quem já está mais perto de
   morrer. Usada tanto pra escolher a casa de destino (alvosPotenciaisDificil)
   quanto pra escolher QUAL alvo atacar dali — antes essas duas escolhas
   usavam heurísticas diferentes, e a de "qual alvo atacar" ignorava abate
   garantido, o que fazia a IA largar um abate na mesa pra beliscar um
   arquétipo "mais pesado" que não ia nem chegar perto de morrer. */
function prioridadeAtaque(atacante, alvo) {
  return (atacante.dano >= alvo.vida ? 1000 : 0) + pesoAlvo(alvo) * 10 + Math.max(0, 20 - alvo.vida);
}
function prioridadeCura(alvo) {
  return (alvo.vidaMax - alvo.vida) + pesoAlvo(alvo);
}
function baseMaisPerto(pos, t) {
  return BASES[t].slice().sort((a, b) => dist(pos, a) - dist(pos, b))[0];
}
function alvosPotenciaisDificil(h) {
  if (h.cura) {
    return T.times[h.t].campo.filter(o => o !== h && o.vida < o.vidaMax)
      .map(o => ({ pos: o.pos, prioridade: prioridadeCura(o) }));
  }
  const inimigo = 1 - h.t;
  const alvos = T.times[inimigo].campo.map(o => ({ pos: o.pos, prioridade: prioridadeAtaque(h, o) }));
  alvos.push({ pos: baseMaisPerto(h.pos, inimigo), prioridade: 5 });
  return alvos;
}
/* Tenta usar a habilidade especial antes de agir normalmente — só
   quando dá pra estimar um ganho real (acerta pelo menos 1 inimigo,
   ou reativa um aliado que já agiu). */
/* Calcula qual seria o melhor alvo pra habilidade do herói `h`, sem
   executar — usada tanto pela IA Difícil (que já mira e usa na hora)
   quanto pela IA Jager Laramais (que testa o resultado antes de
   decidir se vale a pena, dentro da simulação). Retorna [c,r] ou null. */
function melhorAlvoHabilidade(h) {
  if (!habDisponivel(h)) return null;
  const inimigo = 1 - h.t;
  const alvos = alvosHabilidade(h);
  if (!alvos.length) return null;

  if (h.arq === "heavy") {
    const viz = vizinhos(...h.pos);
    let melhor = null, melhorN = 0;
    for (const v of alvos) {
      const flancos = viz.filter(x => x !== v && dist(x, v) === 1);
      const area = [v, ...flancos].slice(0, 3);
      const n = T.times[inimigo].campo.filter(o => area.some(([ac, ar]) => ac === o.pos[0] && ar === o.pos[1])).length;
      if (n > melhorN) { melhorN = n; melhor = v; }
    }
    return melhor;
  }
  if (h.arq === "soldier") {
    const alvo = T.times[inimigo].campo.find(o => !o.intocavel && dist(h.pos, o.pos) === 1);
    return alvo ? alvo.pos : null;
  }
  if (h.arq === "sniper") {
    let melhor = null, melhorN = 0;
    for (const pos of alvos) {
      const linha = direcaoELinha(h.pos, pos);
      if (!linha) continue;
      const cubo2 = offsetParaCubo(...pos);
      const pos2 = cuboParaOffset({ x: cubo2.x + linha.dir.x, y: cubo2.y + linha.dir.y, z: cubo2.z + linha.dir.z });
      const alvo2 = valida(pos2[0], pos2[1]) ? ocupante(pos2[0], pos2[1]) : null;
      const n = 1 + (alvo2 && alvo2.t === inimigo ? 1 : 0);
      if (n > melhorN) { melhorN = n; melhor = pos; }
    }
    return melhor;
  }
  if (h.arq === "runner") {
    let melhor = null, melhorN = 0;
    for (const pos of alvos) {
      const linha = direcaoELinha(h.pos, pos);
      if (!linha) continue;
      let atual = offsetParaCubo(...h.pos), n = 0;
      for (let passo = 0; passo < Math.max(COLS, LINS); passo++) {
        atual = { x: atual.x + linha.dir.x, y: atual.y + linha.dir.y, z: atual.z + linha.dir.z };
        const p = cuboParaOffset(atual);
        if (!valida(p[0], p[1])) break;
        const oc = ocupante(p[0], p[1]);
        if (oc && oc.t === inimigo) { n++; continue; }
        break;
      }
      if (n > melhorN) { melhorN = n; melhor = pos; }
    }
    return melhor;
  }
  if (h.arq === "medic") {
    const alvo = T.times[h.t].campo.find(o => o !== h && o.atacou && dist(h.pos, o.pos) === 1);
    return alvo ? alvo.pos : null;
  }
  return null;
}
function cpuTentaHabilidadeDificil(h) {
  const alvo = melhorAlvoHabilidade(h);
  return !!alvo && usarHabilidade(h, alvo[0], alvo[1]);
}
async function cpuAgeComHeroiDificil(h) {
  if (cpuTentaHabilidadeDificil(h)) return;
  if (await cpuTentaAgir(h)) return;
  const alvos = alvosPotenciaisDificil(h);
  const opcoes = alcanceMovimento(h);
  if (!alvos.length || !opcoes.length) return;
  const inimigos = T.times[1 - h.t].campo;
  let melhor = null, melhorPontos = -Infinity;
  for (const p of opcoes) {
    const exposicao = h.cura ? 0 : inimigos.filter(o => dist(p, o.pos) <= o.alc).length;
    for (const alvo of alvos) {
      let pontos = alvo.prioridade;
      if (dist(p, alvo.pos) <= h.alc) pontos += 500;   // já consegue agir dali
      pontos -= distReal(p, alvo.pos, h) * 5;
      pontos -= exposicao * (h.vidaMax <= 1 ? 40 : 8);
      if (pontos > melhorPontos) { melhorPontos = pontos; melhor = p; }
    }
  }
  if (!melhor) return;
  move(h, melhor[0], melhor[1]);
  await espera(300);
  if (!h.atacou) await cpuTentaAgir(h);
}
async function cpuInvocaDificil(t, tm) {
  let tentativas = 0;
  while (tentativas < 4) {
    tentativas++;
    // guarda 1 de Mana por herói já em campo (pelo menos mover OU agir),
    // senão a CPU gasta tudo invocando e sobra ninguém pra atacar depois
    const reserva = tm.campo.length;
    const acessiveis = tm.bench
      .filter(id => ARQUETIPOS[HERO_ARQ[id]].custo <= tm.mana - reserva)
      .sort((a, b) => ARQUETIPOS[HERO_ARQ[b]].custo - ARQUETIPOS[HERO_ARQ[a]].custo);
    if (!acessiveis.length) break;
    const cels = casasDeInvocacao(t);
    if (!cels.length) break;
    cels.sort((a, b) => dist(a, CENTRO) - dist(b, CENTRO));   // ponto mais avançado primeiro
    invoca(acessiveis[0], cels[0][0], cels[0][1]);
    await espera(380);
  }
}
async function jogaCpuDificil(t) {
  const tm = T.times[t];
  await cpuInvocaDificil(t, tm);
  const ordem = [...tm.campo].sort((a, b) => pesoAlvo(b) - pesoAlvo(a));
  for (const h of ordem) {
    if (!tm.campo.includes(h) || T.fim !== null) continue;
    await cpuAgeComHeroiDificil(h);
    render();
    await espera(300);
  }
}
/* ───────────────────────── IA da CPU — Jager Laramais ─────────────────────────
   A diferença pra Difícil não é um heurística mais esperta — é testar
   VÁRIAS jogadas hipotéticas inteiras (quem invocar, pra onde cada
   herói vai, quem ataca quem) e comparar o RESULTADO de cada uma antes
   de agir de verdade. Só enxerga o que já está visível no tabuleiro
   (a mesma informação que qualquer jogador vê) — não lê nada oculto
   nem simula a jogada do adversário, só as próprias.

   Mecânica: clona o estado (T = structuredClone(real)), liga a flag
   `simulando` (que faz render()/toast()/espera() virarem no-op, pra
   não piscar telas hipotéticas nem abrir o modal de "fim de partida"
   por engano), executa a jogada candidata na cópia, pontua o tabuleiro
   resultante com avaliarEstado(), e descarta a cópia. Repete pra cada
   candidata; no final, reexecuta de verdade só a que pontuou melhor. */

/* Pontua um estado de jogo (T real ou uma cópia simulada) do ponto de
   vista do time `t` — quanto maior, melhor pra esse time. Usa só campos
   já visíveis no tabuleiro (vida, posição, Mana, Base) — nada de
   informação que o jogador não teria. */
function avaliarEstado(estado, t) {
  const inimigo = 1 - t;
  const mt = estado.times[t], mi = estado.times[inimigo];
  let score = (mt.base - mi.base) * 15;
  // Valor de um herói vivo não cai proporcional à vida perdida — o dano
  // dele continua o mesmo até o fim (um Heavy com 1hp bate igual um Heavy
  // com 4hp). Um herói vivo guarda a maior parte do próprio peso mesmo
  // quase morto (só 30% do peso varia com a vida restante); o resto do
  // valor só cai de vez quando o herói de fato morre e some do campo.
  // Com peso proporcional à vida puro (como era antes), meio-matar um
  // Heavy pontuava mais que abater de vez um Runner barato, mesmo esse
  // abate sendo garantido e permanente — a IA largava abates na mesa.
  const valorTime = tm => tm.campo.reduce((s, h) => s + pesoAlvo(h) * (0.7 + 0.3 * (h.vida / h.vidaMax)), 0);
  score += (valorTime(mt) - valorTime(mi)) * 10;
  score += (mt.mana - mi.mana) * 0.3;
  // penaliza deixar herói exposto ao alcance de um inimigo que já está no
  // tabuleiro — não é adivinhar a jogada do adversário, é geometria visível.
  // Escalado pelo peso do arquétipo exposto: perder um Heavy ou um Sniper
  // dói mais que perder um Runner descartável — antes a penalidade era a
  // mesma pra qualquer um não-frágil, então a IA se arriscava com heróis
  // caros do mesmo jeito que se arriscaria com um Runner.
  for (const h of mt.campo) {
    if (mi.campo.some(o => dist(h.pos, o.pos) <= o.alc)) score -= (h.vidaMax <= 1 ? 12 : 4) * (pesoAlvo(h) / 2);
  }
  for (const [pc, pr] of PONTOS_MANA) {
    if (mt.campo.some(h => h.pos[0] === pc && h.pos[1] === pr)) score += 6;
    if (mi.campo.some(h => h.pos[0] === pc && h.pos[1] === pr)) score -= 6;
  }
  // puxão leve pra avançar rumo à Base inimiga — sem isso a IA prefere
  // "empatar com segurança" e nunca pressiona de verdade, deixando a
  // Mana empoçar. Fraco o bastante pra nunca vencer a penalidade de
  // exposição quando a troca é ruim, forte o bastante pra desempatar
  // a favor de avançar quando não há risco.
  for (const h of mt.campo) score -= dist(h.pos, baseMaisPerto(h.pos, inimigo)) * 0.5;
  if (estado.fim === t) score += 10000;
  else if (estado.fim === inimigo) score -= 10000;
  return score;
}

/* Gera até algumas ações candidatas pro herói `h` (lido do T ATUAL —
   nunca guarda referência pra reusar depois de re-clonar). Devolve
   descritores simples (dados, não closures) pra evitar referenciar
   objetos de uma cópia que já foi descartada. */
function candidatosAcaoHeroi(h) {
  const candidatos = [];
  const inimigo = 1 - h.t;

  const alvoHab = melhorAlvoHabilidade(h);
  if (alvoHab) candidatos.push({ tipo: "habilidade", c: alvoHab[0], r: alvoHab[1] });

  if (h.cura) {
    const ac = alvosCura(h);
    if (ac.aliados.length) {
      // até 2 alvos de cura candidatos (não só "quem tem mais HP faltando" —
      // curar um aliado de arquétipo mais valioso pode valer mais mesmo
      // faltando menos vida), deixa avaliarEstado() desempatar de verdade
      const ordenados = ac.aliados.slice().sort((a, b) => prioridadeCura(b) - prioridadeCura(a));
      for (const alvo of ordenados.slice(0, 2)) candidatos.push({ tipo: "curar", alvoUid: alvo._uid });
    }
  } else {
    const av = alvosAtaque(h);
    if (av.herois.length) {
      // até 2 alvos de ataque candidatos, ordenados por prioridadeAtaque —
      // ANTES só existia 1 candidato e a ordenação nem considerava abate
      // garantido, então a IA podia largar um abate na mesa pra beliscar
      // um arquétipo "mais pesado" que não morria de jeito nenhum
      const ordenados = av.herois.slice().sort((a, b) => prioridadeAtaque(h, b) - prioridadeAtaque(h, a));
      for (const alvo of ordenados.slice(0, 2)) candidatos.push({ tipo: "ataca", alvoUid: alvo._uid });
    }
    if (av.base !== null) candidatos.push({ tipo: "atacaBase", timeAlvo: av.base });
  }

  const opcoesMov = alcanceMovimento(h);
  if (opcoesMov.length) {
    const alvos = alvosPotenciaisDificil(h);
    const inimigos = T.times[inimigo].campo;
    const pontuadas = opcoesMov.map(p => {
      const exposicao = h.cura ? 0 : inimigos.filter(o => dist(p, o.pos) <= o.alc).length;
      let melhorPontos = -Infinity;
      for (const alvo of alvos) {
        let pontos = alvo.prioridade;
        if (dist(p, alvo.pos) <= h.alc) pontos += 500;
        pontos -= distReal(p, alvo.pos, h) * 5;
        pontos -= exposicao * (h.vidaMax <= 1 ? 40 : 8);
        if (pontos > melhorPontos) melhorPontos = pontos;
      }
      return { p, pontos: melhorPontos };
    }).sort((a, b) => b.pontos - a.pontos);
    // as 3 melhores casas de destino — dá pra IA comparar mais variações de
    // "avançar e arriscar" vs "posição mais segura" (era 2)
    for (const { p } of pontuadas.slice(0, 3)) candidatos.push({ tipo: "mover", c: p[0], r: p[1] });
  }

  candidatos.push({ tipo: "passar" });   // sempre existe a opção de não fazer nada
  return candidatos;
}

/* Executa um descritor sobre `h` (sempre lido do T corrente) e devolve
   o log de ações reais que ocorreram — usado tanto na simulação quanto
   pra reproduzir de verdade a jogada vencedora depois. */
function executarDescritor(h, desc) {
  const inimigo = 1 - h.t, log = [];
  if (desc.tipo === "habilidade") {
    if (usarHabilidade(h, desc.c, desc.r)) log.push({ tipo: "habilidade", heroUid: h._uid, c: desc.c, r: desc.r });
  } else if (desc.tipo === "curar") {
    const alvo = T.times[h.t].campo.find(x => x._uid === desc.alvoUid);
    if (alvo) { curar(h, alvo); log.push({ tipo: "curar", heroUid: h._uid, alvoUid: alvo._uid }); }
  } else if (desc.tipo === "ataca") {
    const alvo = T.times[inimigo].campo.find(x => x._uid === desc.alvoUid);
    if (alvo) { ataca(h, alvo); log.push({ tipo: "ataca", heroUid: h._uid, alvoUid: alvo._uid }); }
  } else if (desc.tipo === "atacaBase") {
    atacaBase(h, desc.timeAlvo);
    log.push({ tipo: "atacaBase", heroUid: h._uid, timeAlvo: desc.timeAlvo });
  } else if (desc.tipo === "mover") {
    move(h, desc.c, desc.r);
    log.push({ tipo: "move", heroUid: h._uid, c: desc.c, r: desc.r });
    if (!h.atacou) {
      if (h.cura) {
        const ac = alvosCura(h);
        if (ac.aliados.length) {
          const alvo = ac.aliados.slice().sort((a, b) => prioridadeCura(b) - prioridadeCura(a))[0];
          curar(h, alvo); log.push({ tipo: "curar", heroUid: h._uid, alvoUid: alvo._uid });
        }
      } else {
        const av = alvosAtaque(h);
        if (av.herois.length) {
          const alvo = av.herois.slice().sort((a, b) => prioridadeAtaque(h, b) - prioridadeAtaque(h, a))[0];
          ataca(h, alvo); log.push({ tipo: "ataca", heroUid: h._uid, alvoUid: alvo._uid });
        } else if (av.base !== null) {
          atacaBase(h, av.base); log.push({ tipo: "atacaBase", heroUid: h._uid, timeAlvo: av.base });
        }
      }
    }
  }
  return log;
}

/* Busca em feixe (beam search): em vez de cada herói escolher a
   própria ação de forma gananciosa, testa as opções de cada um sobre
   VÁRIOS estados-candidatos em paralelo (o feixe) e só carrega adiante
   os `largura` melhores depois de cada herói agir. No fim, sobra a
   melhor sequência completa de ações do turno inteiro. Largura pequena
   de propósito — o que mantém rápido sem ficar burro. */
/* Quem já tem um abate garantido dali (sem precisar mover) age primeiro —
   sem isso, a poda gananciosa do meio do turno podia descartar o ramo
   que continha esse abate antes dele nunca ser executado, só porque um
   herói de peso maior (mas sem abate disponível) foi escalado pra agir
   antes por pesoAlvo(). */
function temAbateImediato(h) {
  if (h.cura) return false;
  return T.times[1 - h.t].campo.some(o => dist(h.pos, o.pos) <= h.alc && !o.intocavel && h.dano >= o.vida);
}
function beamSearchAcoes(t, largura) {
  const ordemUids = [...T.times[t].campo]
    .sort((a, b) => (temAbateImediato(b) - temAbateImediato(a)) || (pesoAlvo(b) - pesoAlvo(a)))
    .map(h => h._uid);
  let feixe = [{ snapshot: structuredClone(T), log: [] }];
  for (const uid of ordemUids) {
    const proxFeixe = [];
    for (const ramo of feixe) {
      T = structuredClone(ramo.snapshot);
      const h = T.times[t].campo.find(x => x._uid === uid);
      if (!h || T.fim !== null) { proxFeixe.push(ramo); continue; }
      for (const desc of candidatosAcaoHeroi(h)) {
        T = structuredClone(ramo.snapshot);
        const hh = T.times[t].campo.find(x => x._uid === uid);
        if (!hh) continue;
        const entradas = executarDescritor(hh, desc);
        proxFeixe.push({ snapshot: structuredClone(T), log: [...ramo.log, ...entradas] });
      }
    }
    proxFeixe.sort((a, b) => avaliarEstado(b.snapshot, t) - avaliarEstado(a.snapshot, t));
    feixe = proxFeixe.slice(0, Math.max(1, largura));
  }
  return feixe.map(r => ({ score: avaliarEstado(r.snapshot, t), log: r.log })).sort((a, b) => b.score - a.score);
}

/* Planos de invocação pra testar — cada um vira o ponto de partida de uma
   busca em feixe separada, e o conjunto todo (plano de invocação + turno
   de ações) que pontuar melhor é o escolhido. Antes só existiam 2 planos
   ("não invocar nada" ou "gastar tudo que der"), então a IA nunca
   considerava o meio-termo de investir só um pouco e guardar Mana pra
   agir — agora testa um terceiro plano "moderado" também. */
function gerarPlanosInvocacao(t, estadoReal) {
  const tm = estadoReal.times[t];
  const reserva = tm.campo.length;
  const acessiveis = tm.bench.filter(id => ARQUETIPOS[HERO_ARQ[id]].custo <= tm.mana - reserva);
  const planos = [[]];   // sempre testa também "não invocar nada"
  if (acessiveis.length) {
    const cels = casasDeInvocacao(t).slice().sort((a, b) => dist(a, CENTRO) - dist(b, CENTRO));
    if (cels.length) {
      const ordenado = acessiveis.slice().sort((a, b) => ARQUETIPOS[HERO_ARQ[b]].custo - ARQUETIPOS[HERO_ARQ[a]].custo);
      const planoForte = []; let manaRestante = tm.mana; const usados = new Set();
      for (const cel of cels) {
        const escolhido = ordenado.find(id => !usados.has(id) && ARQUETIPOS[HERO_ARQ[id]].custo <= manaRestante - reserva);
        if (!escolhido) continue;
        planoForte.push({ id: escolhido, c: cel[0], r: cel[1] });
        manaRestante -= ARQUETIPOS[HERO_ARQ[escolhido]].custo;
        usados.add(escolhido);
      }
      if (planoForte.length) planos.push(planoForte);
      if (planoForte.length !== 1) {
        planos.push([{ id: ordenado[0], c: cels[0][0], r: cels[0][1] }]);
      }
    }
  }
  return planos;
}

/* Reproduz de verdade (com animação) o log de ações vencedor da
   simulação. `mapaSimParaReal` traduz o _uid que um herói tinha DENTRO
   da simulação pro _uid do herói de verdade — só é preciso pra quem
   foi invocado durante o próprio plano (heróis que já estavam em campo
   mantêm o mesmo _uid nos dois lados, não precisam de tradução). */
async function replayLogReal(t, log, mapaSimParaReal) {
  const resolver = uid => mapaSimParaReal.has(uid) ? mapaSimParaReal.get(uid) : uid;
  for (const ent of log) {
    if (T.fim !== null) break;
    const h = T.times[t].campo.find(x => x._uid === resolver(ent.heroUid));
    if (!h) continue;
    if (ent.tipo === "move") { if (!h.moveu) move(h, ent.c, ent.r); }
    else if (ent.tipo === "ataca") {
      const alvo = T.times[1 - t].campo.find(x => x._uid === resolver(ent.alvoUid));
      if (alvo && !h.atacou) ataca(h, alvo);
    } else if (ent.tipo === "atacaBase") {
      if (!h.atacou) atacaBase(h, ent.timeAlvo);
    } else if (ent.tipo === "curar") {
      const alvo = T.times[t].campo.find(x => x._uid === resolver(ent.alvoUid));
      if (alvo && !h.atacou) curar(h, alvo);
    } else if (ent.tipo === "habilidade") {
      if (habDisponivel(h)) usarHabilidade(h, ent.c, ent.r);
    }
    render();
    await espera(280);
  }
}

async function jogaCpuJagerLaramais(t) {
  const real = T;
  const planosInv = gerarPlanosInvocacao(t, real);
  let melhor = null;   // { invPlano, uidsInvocados, log, score }
  for (const invPlano of planosInv) {
    T = structuredClone(real);
    simulando = true;
    const uidsInvocados = invPlano.map(({ id, c, r }) => { invoca(id, c, r); const oc = ocupante(c, r); return oc ? oc._uid : null; });
    const ramos = beamSearchAcoes(t, 5);
    simulando = false;
    if (ramos.length && (!melhor || ramos[0].score > melhor.score)) {
      melhor = { invPlano, uidsInvocados, log: ramos[0].log, score: ramos[0].score };
    }
  }
  T = real;
  simulando = false;
  if (!melhor) return;

  const mapaSimParaReal = new Map();
  for (let i = 0; i < melhor.invPlano.length; i++) {
    const { id, c, r } = melhor.invPlano[i];
    invoca(id, c, r);
    await espera(380);
    const real2 = ocupante(c, r);
    if (real2 && melhor.uidsInvocados[i] != null) mapaSimParaReal.set(melhor.uidsInvocados[i], real2._uid);
  }
  await replayLogReal(t, melhor.log, mapaSimParaReal);
}

/* ───────────────────────── IA da CPU — Jager Laramais (nova, "suprema") ─────────────────────────
   A Jager Laramais antiga (agora rodando como Difícil, ver jogaCpu())
   só otimizava o PRÓPRIO turno — nunca olhava o que sobrava pro
   adversário responder. Essa aqui vai um lance adiante: pega os
   melhores turnos completos que a busca em feixe encontrou pra ela
   mesma e, só pros mais promissores (testar todos ficaria lento sem
   ganhar nada), simula a MELHOR resposta que o adversário conseguiria
   dar no turno seguinte — com a mesma busca em feixe, só que rodando
   do lado dele — antes de decidir qual dos dois jogar de verdade. Isso
   evita a armadilha clássica da IA "gananciosa": abrir uma posição que
   parece ótima agora mas devolve um contra-ataque decisivo. Continua só
   enxergando o que já está visível no tabuleiro, nunca a mão do
   adversário. */
async function candidatosTurnoCompleto(t, real, largura, maxPlanos = Infinity) {
  const planosInv = gerarPlanosInvocacao(t, real).slice(0, maxPlanos);
  const candidatos = [];
  for (const invPlano of planosInv) {
    T = structuredClone(real);
    const uidsInvocados = invPlano.map(({ id, c, r }) => { invoca(id, c, r); const oc = ocupante(c, r); return oc ? oc._uid : null; });
    const ramos = beamSearchAcoes(t, largura);
    for (const ramo of ramos) candidatos.push({ invPlano, uidsInvocados, log: ramo.log, score: ramo.score });
  }
  return candidatos.sort((a, b) => b.score - a.score);
}
/* Reexecuta um candidato (plano de invocação + log de ações) sobre uma
   cópia de `real`, com a mesma tradução de _uid da simulação pro estado
   reexecutado que o replay de verdade usa (ver replayLogReal) — precisa
   dela porque invoca() sempre gera um _uid novo a cada clone, então o
   _uid gravado no log da 1ª simulação não bate com o do 2º clone. */
async function reconstroiEstado(real, t, candidato) {
  T = structuredClone(real);
  const mapa = new Map();
  candidato.invPlano.forEach(({ id, c, r }, i) => {
    invoca(id, c, r);
    const oc = ocupante(c, r);
    if (oc && candidato.uidsInvocados[i] != null) mapa.set(candidato.uidsInvocados[i], oc._uid);
  });
  await replayLogReal(t, candidato.log, mapa);
  return T;
}
/* Turno inteiro que o adversário jogaria em resposta a `estadoAposMeuTurno`
   (passagem de turno real — Mana, Exausto, Atordoado, pontos de invocação
   — via iniciaTurno(), depois a mesma busca em feixe que a IA usa pra si
   mesma) — devolve a pontuação do resultado do PONTO DE VISTA de `t`
   (o meu time, não o do adversário). */
async function melhorRespostaInimiga(estadoAposMeuTurno, t) {
  const inimigo = 1 - t;
  T = structuredClone(estadoAposMeuTurno);
  T.vez = inimigo;
  iniciaTurno();
  const antesDaResposta = T;
  // largura e nº de planos de invocação bem mais enxutos que a busca
  // "principal" — é uma checagem de sanidade ("essa jogada minha abre
  // uma resposta desastrosa?"), não uma segunda IA completa; testar
  // fundo demais aqui deixaria cada turno da CPU lento pra valer.
  const candidatosInimigo = await candidatosTurnoCompleto(inimigo, antesDaResposta, 2, 2);
  if (!candidatosInimigo.length) return avaliarEstado(antesDaResposta, t);
  const estadoFinal = await reconstroiEstado(antesDaResposta, inimigo, candidatosInimigo[0]);
  return avaliarEstado(estadoFinal, t);
}
async function jogaCpuJagerLaramaisSuprema(t) {
  const real = T;
  simulando = true;
  const candidatos = await candidatosTurnoCompleto(t, real, 5);
  let melhor = null, melhorScore = -Infinity;
  for (const cand of candidatos.slice(0, 3)) {
    const estadoFinal = await reconstroiEstado(real, t, cand);
    const scoreProfundo = estadoFinal.fim !== null ? avaliarEstado(estadoFinal, t) : await melhorRespostaInimiga(estadoFinal, t);
    if (scoreProfundo > melhorScore) { melhorScore = scoreProfundo; melhor = cand; }
  }
  T = real;
  simulando = false;
  if (!melhor) return;

  const mapaSimParaReal = new Map();
  for (let i = 0; i < melhor.invPlano.length; i++) {
    const { id, c, r } = melhor.invPlano[i];
    invoca(id, c, r);
    await espera(380);
    const real2 = ocupante(c, r);
    if (real2 && melhor.uidsInvocados[i] != null) mapaSimParaReal.set(melhor.uidsInvocados[i], real2._uid);
  }
  await replayLogReal(t, melhor.log, mapaSimParaReal);
}

/* Dificuldades em ordem crescente — cada uma reaproveita a IA que antes
   pertencia à de cima: Normal ganhou a heurística que era da Difícil,
   Difícil ganhou a busca em feixe que era da Jager Laramais, e a Jager
   Laramais agora é a "suprema" acima, com antecipação de resposta. */
async function jogaCpu() {
  const t = T.vez;
  if (!T || T.fim !== null || t !== T.cpuTime) return;
  await espera(500);
  if (T.cpuDificuldade === "jagerlaramais") await jogaCpuJagerLaramaisSuprema(t);
  else if (T.cpuDificuldade === "dificil") await jogaCpuJagerLaramais(t);
  else await jogaCpuDificil(t);
  await espera(400);
  if (T.fim === null) encerraTurno();
}

/* ───────────────────────── Boot ───────────────────────── */
if (G("btHab")) G("btHab").onclick = () => {
  if (!selecionado || !habDisponivel(selecionado)) return;
  confirmacaoPendente = null;
  modoHabilidade = !modoHabilidade;
  render();
};
G("btFim").onclick = () => { selecionado = null; bancoSel = null; modoHabilidade = false; confirmacaoPendente = null; encerraTurno(); };
G("sairTutorial").onclick = () => telaAbertura();
telaAbertura();

</script>
